<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comentarios con React</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <!-- ReactDOM -->
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel para procesar JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* Variables de colores */
    :root {
      --primary-color: #fd9207;
      --primary-dark: #b96a29;
      --secondary-color: #f8f9fa;
      --text-color: #333;
      --light-gray: #e9ecef;
      --border-radius: 8px;
      --box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f5f7fa;
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px;
    }

    #root {
      max-width: 700px;
      margin: 0 auto;
    }

    .app-container {
      background-color: white;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      padding: 30px;
      margin-top: 20px;
    }

    .app-header {
      text-align: center;
      margin-bottom: 30px;
      color: var(--primary-color);
      border-bottom: 2px solid var(--light-gray);
      padding-bottom: 15px;
    }

    .comment-form {
      display: flex;
      margin-bottom: 30px;
      gap: 10px;
    }

    .comment-input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid var(--light-gray);
      border-radius: var(--border-radius);
      font-size: 16px;
      transition: border 0.3s ease;
    }

    .comment-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(219, 161, 52, 0.2);
    }

    .submit-button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      padding: 12px 20px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    .submit-button:hover {
      background-color: var(--primary-dark);
    }

    .comments-section {
      background-color: var(--secondary-color);
      border-radius: var(--border-radius);
      padding: 20px;
    }

    .comments-title {
      font-size: 22px;
      margin-bottom: 15px;
      color: var(--primary-dark);
    }

    .comments-list {
      list-style-type: none;
    }

    .comment-item {
      background-color: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      border-left: 4px solid var(--primary-color);
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .empty-comments {
      text-align: center;
      color: #6c757d;
      font-style: italic;
      padding: 15px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Componente de saludo inicial
    function Greeting() {
      return <h1 className="app-header">¡Hola, bienvenido a React!</h1>;
    }

    // Componente hijo: formulario de comentarios
    function CommentForm({ onAddComment }) {
      const [inputValue, setInputValue] = React.useState("");

      const handleSubmit = (e) => {
        e.preventDefault();
        if (inputValue.trim() !== "") {
          onAddComment(inputValue);
          setInputValue("");
        }
      };

      return (
        <form onSubmit={handleSubmit} className="comment-form">
          <input
            type="text"
            placeholder="Escribe un comentario"
            value={inputValue}
            onChange={(e) => setInputValue(e.target.value)}
            className="comment-input"
            autoFocus
          />
          <button type="submit" className="submit-button">
            Enviar
          </button>
        </form>
      );
    }

    // Componente para mostrar un comentario individual
    function CommentItem({ text }) {
      return <li className="comment-item">{text}</li>;
    }

    // Componente padre: App
    function App() {
      const [comments, setComments] = React.useState([]);

      const addComment = (newComment) => {
        setComments([...comments, newComment]);
      };

      return (
        <div className="app-container">
          <Greeting />
          <CommentForm onAddComment={addComment} />
          <div className="comments-section">
            <h2 className="comments-title">Comentarios:</h2>
            {comments.length > 0 ? (
              <ul className="comments-list">
                {comments.map((comment, index) => (
                  <CommentItem key={index} text={comment} />
                ))}
              </ul>
            ) : (
              <p className="empty-comments">No hay comentarios aún. ¡Sé el primero en comentar!</p>
            )}
          </div>
        </div>
      );
    }

    // Renderizar el componente App en el DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
